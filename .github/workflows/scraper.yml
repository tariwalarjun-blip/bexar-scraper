name: Bexar Foreclosure Scraper

on:
  schedule:
    - cron: '0 13 * * *'  # Runs daily at 1:00pm UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Point apt at main Ubuntu mirror
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo apt-get update
      - name: Install dependencies
        timeout-minutes: 10
        run: |
          pip install -r requirements.txt
          playwright install chromium
          for i in 1 2 3; do
            if playwright install-deps chromium; then exit 0; fi
            echo "Attempt $i failed, retrying in 20s..."
            sleep 20
            sudo apt-get update || true
          done
          exit 1
      - name: Write credentials file
        env:
          CREDS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: python3 -c "import os,base64; open('service_account.json','wb').write(base64.b64decode(os.environ['CREDS_JSON']))"
      - name: Run scraper
        env:
          GOOGLE_SHEETS_CREDENTIALS: service_account.json
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ZAPIER_WEBHOOK_URL: ${{ secrets.ZAPIER_WEBHOOK_URL }}
          RESIMPLI_API_KEY: ${{ secrets.RESIMPLI_API_KEY }}
          BATCHDATA_API_TOKEN: ${{ secrets.BATCHDATA_API_TOKEN }}
        run: python bexar_foreclosure_scraper.py

  trustee_lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: scrape  # Always runs right after scrape finishes — manual or scheduled
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Point apt at main Ubuntu mirror
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo apt-get update
      - name: Install dependencies
        timeout-minutes: 10
        run: |
          pip install -r requirements.txt
          playwright install chromium
          for i in 1 2 3; do
            if playwright install-deps chromium; then exit 0; fi
            echo "Attempt $i failed, retrying in 20s..."
            sleep 20
            sudo apt-get update || true
          done
          exit 1
      - name: Write credentials file
        env:
          CREDS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: python3 -c "import os,base64; open('service_account.json','wb').write(base64.b64decode(os.environ['CREDS_JSON']))"
      - name: Run trustee lookup
        env:
          GOOGLE_SHEETS_CREDENTIALS: service_account.json
          SHEET_ID: ${{ secrets.SHEET_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python trustee_lookup.py
